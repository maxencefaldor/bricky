version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]
  # Python dependencies return here once Dependabot supports Python 3.15, which bricky requires:
  # https://github.com/dependabot/dependabot-core/issues/16524. Until then, `uv lock --upgrade`
  # updates them.
