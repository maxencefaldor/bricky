name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  workflow_call: # the release workflow runs CI before it publishes

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  UV_LOCKED: "1"
  FORCE_COLOR: "1"

jobs:
  lint:
    name: Format, lint, types and Markdown
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - name: Install
        run: uv sync
      - name: Format
        run: uv run ruff format --check
      - name: Lint
        run: uv run ruff check --output-format=github
      - name: Types
        run: uv run ty check
      - name: Markdown
        run: uv run rumdl check .

  test:
    name: Tests on Python ${{ matrix.python }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python: ["3.12", "3.13", "3.14", "3.15"]
    env:
      UV_PYTHON: ${{ matrix.python }}
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - name: Install
        run: uv sync
      - name: Cache the browser bricky renders in
        id: browser
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ matrix.python }}-${{ hashFiles('uv.lock') }}
      - name: Install the browser
        if: steps.browser.outputs.cache-hit != 'true'
        run: uv run playwright install --with-deps chromium
      - name: Install the browser's system libraries
        if: steps.browser.outputs.cache-hit == 'true'
        run: uv run playwright install-deps chromium
      - name: Tests
        run: uv run pytest

  examples:
    name: Examples
    runs-on: ubuntu-latest
    # Checking the largest examples for stability takes minutes.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - name: Install
        run: uv sync
      - name: Install the browser
        run: uv run playwright install --with-deps chromium
      - name: Build every example
        run: |
          for script in examples/*.py; do
            uv run bricky build "$script" || [ "$script" = examples/broken.py ]
          done
      - name: Keep the models and their images
        uses: actions/upload-artifact@v7
        with:
          name: examples
          path: |
            examples/*.png
            examples/*.bricky.json
            examples/*.bricky.map.json
          if-no-files-found: error

  packages:
    name: Packages on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - name: Build sdists and wheels
        run: |
          uv build --package bricky
          uv build --package bricky-mcp
      - name: Install the wheels in a fresh environment, on the oldest Python
        run: |
          uv venv --python 3.12 "$RUNNER_TEMP/fresh"
          uv pip install --python "$RUNNER_TEMP/fresh" dist/*.whl
      - name: Build, check and render a model outside the repository
        working-directory: ${{ runner.temp }}
        run: |
          bin="$RUNNER_TEMP/fresh/bin"
          [ -d "$bin" ] || bin="$RUNNER_TEMP/fresh/Scripts"
          "$bin/bricky" --version
          "$bin/bricky-mcp" --version
          "$bin/python" -m playwright install --with-deps chromium
          cp "$GITHUB_WORKSPACE/examples/broken.py" .
          status=0
          "$bin/bricky" build broken.py || status=$?
          test "$status" = 1 # the example's mistakes are errors
          test -f broken.png
      - name: Keep the packages
        if: matrix.os == 'ubuntu-latest'
        uses: actions/upload-artifact@v7
        with:
          name: packages
          path: dist/
          if-no-files-found: error
