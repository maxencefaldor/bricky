# Run with prek (`uvx prek install`) or pre-commit. Every hook uses the versions locked in uv.lock.
repos:
  - repo: local
    hooks:
      - id: ruff-format
        name: ruff format
        entry: uv run --frozen ruff format
        language: system
        types_or: [python, pyi]
      - id: ruff-check
        name: ruff check
        entry: uv run --frozen ruff check --fix
        language: system
        types_or: [python, pyi]
      - id: ty
        name: ty check
        entry: uv run --frozen ty check
        language: system
        types_or: [python, pyi]
        pass_filenames: false
      - id: rumdl
        name: rumdl check
        entry: uv run --frozen rumdl check
        language: system
        types: [markdown]
