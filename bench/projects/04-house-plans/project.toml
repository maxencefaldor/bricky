title = "A house from its plans"
difficulty = 4
max_turns = 60
minutes = 30
prompt = """
Rebuild the house in the plans: `inputs/plans.png` shows it from four sides (iso, front, right and
top), and `inputs/back.png` and `inputs/left.png` show the other two. The orthographic views have
rulers in studs and plates, the units bricky's `at` uses. Match every wall, door, window, the roof
and the chimney: their positions, sizes and colours.
"""

[[generate]]
kind = "render"
file = "inputs/plans.png"
view = "sheet"
caption = "The house: plans"

[[generate]]
kind = "render"
file = "inputs/back.png"
view = "back"
caption = "The house: back"
width = 1200
height = 900

[[generate]]
kind = "render"
file = "inputs/left.png"
view = "left"
caption = "The house: left side"
width = 1200
height = 900
