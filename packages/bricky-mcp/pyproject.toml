[project]
name = "bricky-mcp"
version = "0.2.0"
description = "MCP server exposing the bricky toolkit to any agent harness."
readme = "README.md"
license = "Apache-2.0"
authors = [{ name = "Maxence Faldor" }]
requires-python = ">=3.15"
classifiers = [
  "Development Status :: 2 - Pre-Alpha",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.15",
  "Typing :: Typed",
]
dependencies = ["bricky", "mcp>=2"]

[project.scripts]
bricky-mcp = "bricky_mcp.server:main"

[build-system]
requires = ["uv_build>=0.13.6,<0.14"]
build-backend = "uv_build"
