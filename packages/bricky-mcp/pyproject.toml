[project]
name = "bricky-mcp"
version = "0.1.0"
description = "MCP server exposing the bricky toolkit to any agent harness."
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "Maxence Faldor" }]
keywords = ["lego", "ai agents", "mcp", "model context protocol", "llm"]
requires-python = ">=3.12"
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Programming Language :: Python :: 3.15",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
  "Typing :: Typed",
]
dependencies = ["bricky==0.1.0", "mcp>=2.1"]

[project.urls]
Homepage = "https://maxencefaldor.github.io/bricky/"
Documentation = "https://maxencefaldor.github.io/bricky/"
Source = "https://github.com/maxencefaldor/bricky"
Issues = "https://github.com/maxencefaldor/bricky/issues"
Changelog = "https://github.com/maxencefaldor/bricky/releases"

[project.scripts]
bricky-mcp = "bricky_mcp.server:main"

[build-system]
requires = ["uv_build>=0.13.6,<0.14"]
build-backend = "uv_build"
