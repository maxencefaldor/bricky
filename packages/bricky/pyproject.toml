[project]
name = "bricky"
version = "0.1.0"
description = "A compiler-style toolkit that lets AI agents design buildable LEGO® models."
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "Maxence Faldor" }]
keywords = ["lego", "ai agents", "llm", "geometry", "cad", "mcp", "3d", "voxels"]
requires-python = ">=3.12"
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "Intended Audience :: Science/Research",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Programming Language :: Python :: 3.15",
  "Topic :: Multimedia :: Graphics :: 3D Modeling",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
  "Typing :: Typed",
]
dependencies = [
  "clarabel>=0.11.1",
  "highspy>=1.15.1",
  "numpy>=2.5.2",
  "platformdirs>=4",
  "playwright>=1.63",
  "pydantic>=2.14",
  "pydantic-settings>=2.15",
  "scipy>=1.18",
]

[project.urls]
Homepage = "https://maxencefaldor.github.io/bricky/"
Documentation = "https://maxencefaldor.github.io/bricky/"
Source = "https://github.com/maxencefaldor/bricky"
Issues = "https://github.com/maxencefaldor/bricky/issues"
Changelog = "https://github.com/maxencefaldor/bricky/releases"

[project.scripts]
bricky = "bricky.cli:main"

[project.entry-points."bricky.passes"]
schema = "bricky.passes.schema:SchemaPass"
collision = "bricky.passes.collision:CollisionPass"
connectivity = "bricky.passes.connectivity:ConnectivityPass"
stability = "bricky.passes.stability:StabilityPass"

[build-system]
requires = ["uv_build>=0.13.6,<0.14"]
build-backend = "uv_build"
