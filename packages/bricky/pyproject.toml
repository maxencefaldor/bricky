[project]
name = "bricky"
version = "0.2.0"
description = "A compiler-style toolkit that lets AI agents design buildable LEGO® models."
readme = "README.md"
license = "Apache-2.0"
authors = [{ name = "Maxence Faldor" }]
requires-python = ">=3.15"
classifiers = [
  "Development Status :: 2 - Pre-Alpha",
  "Intended Audience :: Developers",
  "Intended Audience :: Science/Research",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.15",
  "Typing :: Typed",
]
dependencies = [
    "platformdirs>=4",
    "playwright>=1.63",
    "pydantic>=2",
    "pydantic-settings>=2",
]

[project.scripts]
bricky = "bricky.cli:main"

[project.entry-points."bricky.passes"]
schema = "bricky.passes.schema:SchemaPass"
collision = "bricky.passes.collision:CollisionPass"
connectivity = "bricky.passes.connectivity:ConnectivityPass"

[build-system]
requires = ["uv_build>=0.13.6,<0.14"]
build-backend = "uv_build"
