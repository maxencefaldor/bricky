# Same format as an imported catalog (see bricky.catalog.CatalogFile), written by hand. Ids, names,
# categories and colors follow BrickLink as remembered; an import replaces them with BrickLink's own
# data. Each part's `shape` is bricky's: the family that generates its geometry, and its numbers.
# `size` counts studs along the part's local x and y axes; heights count plates (a brick is 3).

