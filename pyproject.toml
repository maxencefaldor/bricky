[tool.uv.workspace]
members = ["packages/*"]

[tool.uv.sources]
bricky = { workspace = true }
bricky-bench = { workspace = true }
bricky-mcp = { workspace = true }

[dependency-groups]
dev = [
  "bricky",
  "bricky-bench",
  "bricky-mcp",
  "hypothesis>=6.170",
  "pytest>=9.1",
  "rumdl>=0.3",
  "ruff>=0.17",
  "ty>=0.0.92",
  "pytest-github-actions-annotate-failures>=0.4.2",
]
docs = ["mkdocstrings-python>=2", "zensical>=0.0.73"]

[tool.ruff]
# The workspace root has no [project] table, so ruff cannot read requires-python here.
target-version = "py315"
src = ["packages/bricky/src", "packages/bricky-bench/src", "packages/bricky-mcp/src"]

[tool.ruff.lint]
select = ["ALL"]
ignore = [
  "COM812", # the formatter places trailing commas itself
  # pydantic reads annotations at runtime, so an import used only in an annotation is still a
  # runtime import, and bricky writes no TYPE_CHECKING blocks.
  "TC",
]

[tool.ruff.lint.per-file-ignores]
# pytest checks with assert and imports test folders by path; a test's name says what it checks,
# and the values it expects are its content.
"**/tests/**" = ["D100", "D103", "INP001", "PLR2004", "S101"]
# Build scripts are models written as code: their numbers are the model, they print to the build
# report, and they run as scripts, outside any package.
"examples/**" = ["INP001", "PLR2004", "T201"]
"bench/**" = ["INP001", "PLR2004", "T201"]
# Scripts that draw the docs' pictures and pages, and say what they wrote.
"docs/*.py" = ["INP001", "PLR2004", "T201"]
"packages/*/src/*/cli.py" = ["T201"] # a command line prints

[tool.ruff.lint.flake8-builtins]
# "id" is the vocabulary word for identifiers, in models, catalogs and the builder's arguments.
builtins-ignorelist = ["id"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.format]
docstring-code-format = true

[tool.ty.environment]
python-version = "3.15"

[tool.ty.rules]
all = "error"

[tool.pytest]
minversion = "9.1"
testpaths = ["packages"]
addopts = ["--import-mode=importlib", "--doctest-modules", "--strict-config", "--strict-markers", "-ra"]
filterwarnings = ["error"]
xfail_strict = true
# Expected output in docstrings wraps at 88 columns like the code around it.
doctest_optionflags = ["NORMALIZE_WHITESPACE"]

