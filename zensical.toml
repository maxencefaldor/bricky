[project]
site_name = "bricky"
site_description = "A compiler-style toolkit that lets AI agents design buildable LEGO® models."
site_author = "Maxence Faldor"
site_url = "https://maxencefaldor.github.io/bricky/"
repo_url = "https://github.com/maxencefaldor/bricky"
repo_name = "maxencefaldor/bricky"
edit_uri = "edit/main/docs/"
exclude_docs = """
*.py
__pycache__/
"""
copyright = "LEGO® is a trademark of the LEGO Group, which does not sponsor, authorize or endorse this project."
nav = [
  { "Home" = "index.md" },
  { "Get started" = "get-started.md" },
  { "Guide" = [
    { "Coordinates" = "guide/coordinates.md" },
    { "Parts and colors" = "guide/parts.md" },
    { "Build scripts" = "guide/scripts.md" },
    { "Checks" = "guide/checks.md" },
    { "Pictures" = "guide/pictures.md" },
    { "Voxels" = "guide/voxels.md" },
    { "The catalog" = "guide/catalog.md" },
  ] },
  { "Agents" = [
    { "MCP server" = "agents/mcp.md" },
    { "Skill" = "agents/skill.md" },
    { "Benchmark" = "agents/benchmark.md" },
  ] },
  { "Examples" = "examples.md" },
  { "Reference" = [
    { "Command line" = "reference/cli.md" },
    { "Models" = "reference/models.md" },
    { "Checks" = "reference/checks.md" },
    { "Catalog" = "reference/catalog.md" },
    { "Geometry" = "reference/geometry.md" },
    { "Renders" = "reference/render.md" },
  ] },
  { "Contributing" = "contributing.md" },
]

[project.theme]
language = "en"
logo = "assets/logo.svg"
favicon = "assets/logo.svg"
features = [
  "content.code.annotate",
  "content.code.copy",
  "content.tabs.link",
  "content.tooltips",
  "navigation.footer",
  "navigation.indexes",
  "navigation.instant",
  "navigation.instant.prefetch",
  "navigation.path",
  "navigation.sections",
  "navigation.top",
  "navigation.tracking",
  "search.highlight",
  "toc.follow",
]

[[project.theme.palette]]
media = "(prefers-color-scheme)"
toggle.icon = "lucide/sun-moon"
toggle.name = "Switch to light mode"

[[project.theme.palette]]
media = "(prefers-color-scheme: light)"
scheme = "default"
primary = "red"
accent = "amber"
toggle.icon = "lucide/sun"
toggle.name = "Switch to dark mode"

[[project.theme.palette]]
media = "(prefers-color-scheme: dark)"
scheme = "slate"
primary = "red"
accent = "amber"
toggle.icon = "lucide/moon"
toggle.name = "Switch to system preference"

[project.markdown_extensions]
abbr = {}
admonition = {}
attr_list = {}
def_list = {}
footnotes = {}
md_in_html = {}
tables = {}
toc.permalink = true
pymdownx.betterem = {}
pymdownx.details = {}
pymdownx.highlight.anchor_linenums = true
pymdownx.highlight.line_spans = "__span"
pymdownx.highlight.pygments_lang_class = true
pymdownx.inlinehilite = {}
pymdownx.keys = {}
pymdownx.snippets.base_path = ["."]
pymdownx.snippets.check_paths = true
pymdownx.superfences.custom_fences = [
  { name = "mermaid", class = "mermaid", format = "pymdownx.superfences.fence_code_format" },
]
pymdownx.tabbed.alternate_style = true
pymdownx.tasklist.custom_checkbox = true

[project.plugins.mkdocstrings.handlers.python]
paths = ["packages/bricky/src", "packages/bricky-mcp/src", "packages/bricky-bench/src"]
inventories = ["https://docs.python.org/3/objects.inv", "https://docs.pydantic.dev/latest/objects.inv"]

[project.plugins.mkdocstrings.handlers.python.options]
docstring_style = "google"
show_source = false
show_root_heading = true
show_root_full_path = false
show_symbol_type_heading = true
show_symbol_type_toc = true
members_order = "source"
separate_signature = true
show_signature_annotations = true
signature_crossrefs = true
merge_init_into_class = true
show_bases = false
filters = ["!^_"]
