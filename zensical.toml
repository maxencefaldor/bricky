[project]
site_name = "bricky"
site_description = "A compiler-style toolkit that lets AI agents design buildable LEGO® models."
site_author = "Maxence Faldor"
site_url = "https://maxencefaldor.github.io/bricky/"
repo_url = "https://github.com/maxencefaldor/bricky"
repo_name = "maxencefaldor/bricky"
exclude_docs = """
*.py
__pycache__/
"""
copyright = "LEGO® is a trademark of the LEGO Group, which does not sponsor, authorize or endorse this project. Part shapes converted from the LDraw.org Parts Library are licensed under CC BY 4.0."
extra_css = ["assets/bricky.css"]
nav = [
  { "Home" = "index.md" },
  { "Get started" = "get-started.md" },
  { "Guide" = [
    { "Coordinates" = "guide/coordinates.md" },
    { "Build scripts" = "guide/scripts.md" },
    { "Parts and colors" = "guide/parts.md" },
    { "Checks" = "guide/checks.md" },
    { "Images" = "guide/images.md" },
    { "Voxels" = "guide/voxels.md" },
    { "Catalog" = "guide/catalog.md" },
  ] },
  { "Agents" = [
    { "Connect an agent" = "agents/connect.md" },
    { "Benchmark" = "agents/benchmark.md" },
  ] },
  { "Gallery" = "gallery.md" },
  { "Reference" = [
    { "Command line" = "reference/cli.md" },
    { "Diagnostic codes" = "reference/codes.md" },
    { "Configuration" = "reference/configuration.md" },
    { "Python API" = [
      { "Models" = "reference/models.md" },
      { "Catalog" = "reference/catalog.md" },
      { "Checks" = "reference/checks.md" },
      { "Geometry" = "reference/geometry.md" },
      { "Rendering" = "reference/rendering.md" },
    ] },
  ] },
  { "Contributing" = "contributing.md" },
]

[project.theme]
logo = "assets/logo.svg"
favicon = "assets/logo.svg"
features = [
  "content.code.copy",
  "content.tooltips",
  "navigation.footer",
  "navigation.indexes",
  "navigation.instant",
  "navigation.instant.prefetch",
  "navigation.path",
  "navigation.sections",
  "navigation.top",
  "navigation.tracking",
  "search.highlight",
  "toc.follow",
]

[[project.theme.palette]]
media = "(prefers-color-scheme)"
primary = "custom"
accent = "custom"
toggle.icon = "lucide/sun-moon"
toggle.name = "Switch to light mode"

[[project.theme.palette]]
media = "(prefers-color-scheme: light)"
scheme = "default"
primary = "custom"
accent = "custom"
toggle.icon = "lucide/sun"
toggle.name = "Switch to dark mode"

[[project.theme.palette]]
media = "(prefers-color-scheme: dark)"
scheme = "slate"
primary = "custom"
accent = "custom"
toggle.icon = "lucide/moon"
toggle.name = "Switch to system preference"

# Listing extensions replaces Zensical's defaults, which leave out snippets: the docs use only these.
[project.markdown_extensions]
attr_list = {}
md_in_html = {}
toc.permalink = true
pymdownx.highlight.anchor_linenums = true
pymdownx.highlight.line_spans = "__span"
pymdownx.highlight.pygments_lang_class = true
pymdownx.snippets.check_paths = true
pymdownx.superfences.custom_fences = [{ name = "mermaid", class = "mermaid" }]
pymdownx.tabbed.alternate_style = true

[project.plugins.mkdocstrings.handlers.python]
inventories = ["https://docs.python.org/3/objects.inv", "https://docs.pydantic.dev/latest/objects.inv"]

[project.plugins.mkdocstrings.handlers.python.options]
show_source = false
show_root_heading = true
show_root_full_path = false
show_symbol_type_heading = true
show_symbol_type_toc = true
members_order = "source"
separate_signature = true
show_signature_annotations = true
signature_crossrefs = true
merge_init_into_class = true
show_bases = false
filters = ["!^_"]
